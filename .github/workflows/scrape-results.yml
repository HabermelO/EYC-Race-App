name: Scrape EYC Results

on:
  # Run every 6 hours
  schedule:
    - cron: '0 */6 * * *'

  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit results.json back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run results scraper
        run: python scrape_results.py

      - name: Check if results.json changed
        id: diff
        run: |
          git diff --quiet results.json && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push if changed
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "EYC Results Bot"
          git config user.email "results-bot@users.noreply.github.com"
          git add results.json
          git commit -m "chore: update results.json [skip ci]"
          git push
